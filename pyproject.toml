[project]
name = "ttr"
version = "0.1.0"
description = "Ticket to Ride: Europe — rules engine, bots and a multiplayer browser game"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dmytro Moroz", email = "dmytro.moroz1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/dmytro-mz/ttr"
Issues = "https://github.com/dmytro-mz/ttr/issues"

[project.scripts]
ttr = "ttr:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
